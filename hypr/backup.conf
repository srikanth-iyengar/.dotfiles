monitor=,preferred,auto,auto

$terminal = alacritty
$fileManager = thunar
$menu = ~/apps/flare/vicinae toggle
$browser = ~/apps/zen/zen


exec-once = hyprpaper
exec-once = ~/apps/flare/vicinae server
exec-once = hyprctl setcursor Bibata-Modern-Ice 32

env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,32                  # Replace 24 with your desired size
cursor {
  enable_hyprcursor = true
  sync_gsettings_theme = true
}

animations {
	enabled = no
}

general {
    gaps_in = 0
    gaps_out = 0

    border_size = 0
    col.active_border = rgba(81,161,193,0.8) rgba(130,145,158,0.8) 45deg
    col.inactive_border = rgba(59,63,78,0.6)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 3

        vibrancy = 0.1696
        new_optimizations = true
    }
}

dwindle {
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = ALT, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, exec, $HOME/bin/chworkspace.sh 1
bind = $mainMod, 2, exec, $HOME/bin/chworkspace.sh 2
bind = $mainMod, 3, exec, $HOME/bin/chworkspace.sh 3
bind = $mainMod, 4, exec, $HOME/bin/chworkspace.sh 4
bind = $mainMod, 5, exec, $HOME/bin/chworkspace.sh 5
bind = $mainMod, 6, exec, $HOME/bin/chworkspace.sh 6
bind = $mainMod, 7, exec, $HOME/bin/chworkspace.sh 7
bind = $mainMod, 8, exec, $HOME/bin/chworkspace.sh 8
bind = $mainMod, 9, exec, $HOME/bin/chworkspace.sh 9
bind = $mainMod, 0, exec, $HOME/bin/chworkspace.sh 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = ,XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = ALT ,XF86AudioRaiseVolume, exec, brightnessctl s +20
bind = ALT ,XF86AudioLowerVolume, exec, brightnessctl s 20-
# bind = ALT ,F12, exec, ~/bin/eww open --toggle dock-bar
bind = $mainMod SHIFT,S, exec, hyprshot -m region

windowrule = match:class ^(zen)$, workspace 2 silent
windowrule = match:class ^(Alacritty)$, workspace 1 silent
windowrule = match:class ^(thunar)$, workspace 6 silent
windowrule = no_blur off, match:class ^(Alacritty)$

bind = $mainMod, B, exec, $browser

workspace=1,monitor:DP-1
workspace=2,monitor:DP-1
workspace=3,monitor:DP-1
workspace=4,monitor:DP-1
workspace=5,monitor:DP-1

workspace=6,monitor:HDMI-A-1
workspace=7,monitor:HDMI-A-1
workspace=8,monitor:HDMI-A-1
workspace=9,monitor:HDMI-A-1
workspace=10,monitor:HDMI-A-1

exec-once = sleep 1 && kanshi

exec-once = $browser
exec-once = sleep 2 && $terminal

exec-once = sleep 3 && wlsunset
exec-once = sleep 4 && eww -c "$HOME/.config/eww" --restart
exec-once = sleep 5 && "$HOME/bin/eww" open --toggle dock-bar
exec-once = bluetoothctl connect 40:F6:BC:81:6F:05

